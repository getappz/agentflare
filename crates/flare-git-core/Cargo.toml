[package]
name = "flare-git-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "Apache-2.0"
description = "Local git primitives, worktree management, and PATH-shim policy (classify/snapshot/provenance/audit) for agentflare -- single source of truth, consumed by the CLI, MCP server, and the git PATH shim."
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
agentflare-backend = { package = "agentflare-backend", path = "../agentflare-backend" }
agentflare-shim = { path = "../agentflare-shim" }
walkdir = "2"
sha2 = "0.10"
agentflare-config = { path = "../agentflare-config" }
dirs = "6"
which = "6"
fs2 = "0.4"
toml = "0.8"
thiserror = "2"
flare-process = { path = "../flare-process" }
agentflare-workspace-hack = { version = "0.1", path = "../../agentflare-workspace-hack" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Console"] }

[dev-dependencies]
tempfile = "3"
