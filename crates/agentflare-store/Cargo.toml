[package]
name = "agentflare-store"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "Apache-2.0"
description = "Local-first document, artifact, blob, and memory storage for AI agent CLIs. SQLite index + content-addressed files. Zero external infra."
publish = false

[dependencies]
db_kit = { package = "agentflare-db-kit", path = "../agentflare-db-kit" }
flare-search-kit = { path = "../flare-search-kit" }
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1.5"
flate2 = "1"
thiserror = "2"
parking_lot = "0.12"
bytemuck = { version = "1", features = ["derive"] }
text-splitter = { version = "0.32", default-features = false, features = ["markdown"] }
anyhow = { version = "1", optional = true }
dirs = { version = "6", optional = true }
tracing = { version = "0.1", optional = true }
ureq = { version = "2", features = ["json"], optional = true }
sha2 = { version = "0.10", optional = true }
ndarray = { version = "0.17", optional = true }
ort = { version = "=2.0.0-rc.13", optional = true, default-features = true, features = ["ndarray"] }
fastembed = { version = "6", optional = true, default-features = false, features = ["hf-hub"] }
sqlite-vec = { version = "0.1", optional = true }
agentflare-workspace-hack = { version = "0.1", path = "../../agentflare-workspace-hack" }

[features]
default = []
embeddings = ["dep:anyhow", "dep:dirs", "dep:tracing", "dep:ureq", "dep:sha2", "dep:ndarray", "dep:ort", "dep:fastembed"]
vector = ["dep:sqlite-vec", "embeddings"]

[dev-dependencies]
tempfile = "3"
