[package]
name = "flare-proxy"
version = "0.1.0"
edition = "2021"
description = "Anthropic→OpenAI proxy for free and paid providers (registry-driven, see registry/providers.toml)"
license = "Apache-2.0"
repository = "https://github.com/getappz/agentflare"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
futures = "0.3"
base64 = "0.22"
regex = "1"
nanoid = "0.5"
toml = "0.8"
dirs = "6"
ureq = "2"
agentflare-workspace-hack = { version = "0.1", path = "../../agentflare-workspace-hack" }
