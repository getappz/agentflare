[package]
name = "agentflare-approval"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "Apache-2.0"
description = "Fail-closed human-in-the-loop approval gate: command classification, autonomy tiers, redaction, and a restart-safe pending-approval store."
repository = "https://github.com/getappz/agentflare"
publish = false

[dependencies]
agentflare-store = { path = "../agentflare-store" }
db_kit = { package = "agentflare-db-kit", path = "../agentflare-db-kit" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
parking_lot = "0.12"
tokio = { version = "1", features = ["sync", "rt", "macros", "time"] }
tracing = "0.1"
agentflare-workspace-hack = { version = "0.1", path = "../../agentflare-workspace-hack" }

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "macros", "rt-multi-thread", "sync", "time"] }
tempfile = "3"

[lints.rust]
unsafe_code = "warn"
