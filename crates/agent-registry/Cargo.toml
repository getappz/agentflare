[package]
name = "agentflare-agent-registry"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "AI agent definitions and detection for agentflare"
license = "Apache-2.0"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
