[package]
name = "flare-browser"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "Apache-2.0"
description = "Browser automation for AI coding agents — consolidated best-of (vercel agent-browser CLI-first + ref snapshots, Playwright-MCP isolation flags, Stagehand observe/extract helpers). v1 delegates to the agent-browser sidecar binary; the argv/session/redaction core here is backend-agnostic for a future native CDP driver."
publish = false

[dependencies]
agentflare-workspace-hack = { version = "0.1", path = "../../agentflare-workspace-hack" }
flare-process = { path = "../flare-process" }

[dev-dependencies]
tempfile = "3"
