[package]
name = "agentflare-bin-lib"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "Types and helpers extracted from the agentflare binary crate: paths, local state/store, errors, dispatch-failure ceiling, mise install. Depends on agentflare-backend/store/registries, so it sits above them, not below — not a dependency-free foundation crate."
license = "Apache-2.0"
repository = "https://github.com/getappz/agentflare"
publish = false

[dependencies]
agent-registry = { package = "agentflare-agent-registry", path = "../agent-registry" }
agentflare-backend = { package = "agentflare-backend", path = "../agentflare-backend" }
agentflare-config = { path = "../agentflare-config" }
agentflare-store = { path = "../agentflare-store" }
dirs = "6"
flare-process = { path = "../flare-process" }
rmcp = { version = "1.8.0", optional = true }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
skill-registry = { package = "agentflare-skill-registry", path = "../skill-registry" }
thiserror = "2"
tempfile = { version = "3", optional = true }
agentflare-workspace-hack = { version = "0.1", path = "../../agentflare-workspace-hack" }

[features]
# Pulls in the full MCP SDK for the AgentflareError -> rmcp::ErrorData
# conversion. Off by default so a consumer that only wants e.g. paths::home()
# doesn't pay for rmcp; the root binary crate turns this on.
mcp = ["dep:rmcp"]
test-support = ["dep:tempfile"]

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
