[package]
name = "agentflare-flare-insights"
version = "0.1.0"
edition = "2021"
description = "Unified observability for AI coding agent sessions - ingest, replay, search, analytics (flare-insights)"
license = "MIT"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "net"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
notify = { version = "6", default-features = false }
walkdir = "2"
regex = "1"
sha2 = "0.10"
hex = "0.4"
anyhow = "1"
dirs = "6"
flare-search-kit = { path = "../flare-search-kit" }

[dev-dependencies]
tempfile = "3"
