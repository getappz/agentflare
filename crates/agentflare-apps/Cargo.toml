[package]
name = "agentflare-apps"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
gateway-registry = { package = "agentflare-gateway-registry", path = "../gateway-registry" }
agentflare-workspace-hack = { version = "0.1", path = "../../agentflare-workspace-hack" }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "warn"
