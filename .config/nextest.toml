[profile.default]
# A single hung test shouldn't be able to pin a runner for the job's full
# 25-minute timeout (see ci.yml) — kill it well before that and let the rest
# of the suite keep going.
slow-timeout = { period = "60s", terminate-after = 5 }

# windows-latest CI used to hit one signature over and over (PRs
# #436/#438/#441/#443, then 1-7 tests per run through 2026-09-25): a
# *different* test each time, killed at exactly this slow-timeout's 300s
# boundary, passing instantly on retry. Root cause (item #314): every one
# of those tests reached `agent-detector`'s process-tree walk -- directly
# via `claims::owner_id()`, or through the git PATH shim that cargo's
# target-dir-on-PATH makes bare `git` spawns resolve to on Windows -- and
# that walk opened a handle to every process on the machine; under
# parallel test load that call intermittently never returned. The walk is
# now bounded to the ancestor chain (`flare_process::agent`). Retries stay
# as a generic backstop for runner flakes, not as cover for that hang --
# see nexte.st/docs/configuration for the field.
retries = 2
