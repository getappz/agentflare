# Upstream rusqlite_migration 2.6.0 still requires rusqlite ^0.40, which pulls
# libsqlite3-sys 0.38 (RUSTSEC-2026-0459). This path patch is that release with
# the rusqlite requirement moved to 0.41 (libsqlite3-sys 0.39). Delete it when
# a crates.io release depends on rusqlite 0.41.
[package]
name = "rusqlite_migration"
version = "2.6.0"
edition = "2021"
rust-version = "1.95"
description = "Simple schema migration library for rusqlite using user_version instead of an SQL table to maintain the current schema version."
license = "Apache-2.0"
repository = "https://github.com/cljoly/rusqlite_migration"
readme = "README.md"
publish = false

[features]
default = []
from-directory = ["dep:include_dir"]

[dependencies]
include_dir = { version = "0.7.4", optional = true }
log = "0.4"
rusqlite = { version = "0.41", default-features = false }
