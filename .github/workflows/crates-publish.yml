name: crates-publish

# Publishes flare-db-macros and flare-db to crates.io with trusted publishing
# (OIDC, no stored token). Both crates are excluded from the main workspace
# (separate lockfiles and feature matrices, see the root Cargo.toml), so they
# are published by manifest path. flare-db-macros goes first because flare-db
# pins it exactly. A version that is already on crates.io is skipped, so the
# job is safe to re-run after bumping only one crate.
#
# The crates.io trusted publisher for each crate must name this workflow file
# (crates-publish.yml). Dry run packages and verifies without publishing; note
# that cargo cannot verify flare-db against a flare-db-macros version that is
# not on crates.io yet.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Package and verify only; do not publish"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: crates-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - run: rustup toolchain install 1.94.0 --profile minimal

      - name: Authenticate with crates.io (trusted publishing)
        if: ${{ !inputs.dry_run }}
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          publish() {
            local dir="$1" name version
            name=$(grep -m1 '^name = ' "$dir/Cargo.toml" | cut -d'"' -f2)
            version=$(grep -m1 '^version = ' "$dir/Cargo.toml" | cut -d'"' -f2)
            if curl -fsS -o /dev/null -A "agentflare-ci (https://github.com/getappz/agentflare)" \
                "https://crates.io/api/v1/crates/${name}/${version}"; then
              echo "${name} ${version} is already on crates.io, skipping"
              return 0
            fi
            if [[ "${DRY_RUN}" == "true" ]]; then
              echo "DRY RUN: packaging ${name} ${version}"
              cargo +1.94.0 publish --manifest-path "$dir/Cargo.toml" --dry-run
            else
              echo "Publishing ${name} ${version}"
              cargo +1.94.0 publish --manifest-path "$dir/Cargo.toml"
            fi
          }
          publish crates/flare-db-macros
          publish crates/flare-db
