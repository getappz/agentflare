name: win-hang-repro

# TEMPORARY (item #314): reproduces the windows-latest nextest hangs with a
# process-tree watcher so the blocked process can be identified. Delete
# before merge.

# `gh workflow run` only resolves workflows that exist on the default
# branch, so this triggers on pushes to the task branch instead. Knobs are
# the two env vars below.
on:
  push:
    branches: ['task/314-**']

env:
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  REPRO_ITERATIONS: "3"
  REPRO_ASSUME_HUMAN: "0"

jobs:
  repro:
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          save-if: "false"
      - uses: mozilla-actions/sccache-action@d651010b8da762cde178750d8eda7b5febfe147a # v0.0.9
      - uses: taiki-e/install-action@91ddec75689c4c78665b598d188dc821c5a43e5c # v2.85.9
        with:
          tool: nextest
      - name: Build test binaries
        run: cargo nextest run --workspace --no-run

      - name: Loop tests with a hang watcher
        shell: pwsh
        env:
          ITERATIONS: ${{ env.REPRO_ITERATIONS }}
          ASSUME_HUMAN: ${{ env.REPRO_ASSUME_HUMAN }}
        run: |
          $dump = Join-Path $env:GITHUB_WORKSPACE "hang-dump.txt"
          "watcher started $(Get-Date -Format o)" | Out-File $dump
          $watcher = Start-Job -ArgumentList $dump -ScriptBlock {
            param($dump)
            $seen = @{}
            while ($true) {
              Start-Sleep -Seconds 5
              $now = Get-Date
              $procs = Get-CimInstance Win32_Process
              $old = $procs | Where-Object {
                ($_.Name -match '^(git|gh|agentflare)\.exe$' -or ($_.CommandLine -and $_.CommandLine -match ' --exact ')) -and
                $_.CreationDate -and (($now - $_.CreationDate).TotalSeconds -gt 30)
              }
              foreach ($p in $old) {
                if ($seen.ContainsKey($p.ProcessId)) { continue }
                $seen[$p.ProcessId] = $true
                $age = [int](($now - $p.CreationDate).TotalSeconds)
                "==== $(Get-Date -Format o) STUCK pid=$($p.ProcessId) age=${age}s name=$($p.Name)" | Out-File $dump -Append
                "  cmd: $($p.CommandLine)" | Out-File $dump -Append
                # Ancestors
                $cur = $p
                for ($i = 0; $i -lt 8 -and $cur; $i++) {
                  $par = $procs | Where-Object { $_.ProcessId -eq $cur.ParentProcessId } | Select-Object -First 1
                  if (-not $par) { break }
                  "  parent[$i]: pid=$($par.ProcessId) name=$($par.Name) cmd=$($par.CommandLine)" | Out-File $dump -Append
                  $cur = $par
                }
                # Children
                $kids = $procs | Where-Object { $_.ParentProcessId -eq $p.ProcessId }
                foreach ($k in $kids) {
                  $kage = if ($k.CreationDate) { [int](($now - $k.CreationDate).TotalSeconds) } else { -1 }
                  "  child: pid=$($k.ProcessId) age=${kage}s name=$($k.Name) cmd=$($k.CommandLine)" | Out-File $dump -Append
                }
                # Thread states
                try {
                  $gp = Get-Process -Id $p.ProcessId -ErrorAction Stop
                  "  handles=$($gp.HandleCount) threads=$($gp.Threads.Count) cpu=$($gp.TotalProcessorTime)" | Out-File $dump -Append
                  foreach ($t in $gp.Threads) {
                    $wr = if ($t.ThreadState -eq 'Wait') { $t.WaitReason } else { '' }
                    "    thread id=$($t.Id) state=$($t.ThreadState) wait=$wr cpu=$($t.TotalProcessorTime)" | Out-File $dump -Append
                  }
                } catch {
                  "  (Get-Process failed: $_)" | Out-File $dump -Append
                }
              }
            }
          }

          $cfg = Join-Path $env:RUNNER_TEMP "nextest-repro.toml"
          @"
          [profile.default]
          slow-timeout = { period = "30s", terminate-after = 10 }
          retries = 0
          "@ | Out-File $cfg -Encoding ascii

          if ($env:ASSUME_HUMAN -eq "1") { $env:AGENTFLARE_GIT_ASSUME_HUMAN = "1" }
          $n = [int]$env:ITERATIONS
          for ($i = 1; $i -le $n; $i++) {
            "#### iteration $i $(Get-Date -Format o)" | Out-File $dump -Append
            cargo nextest run --workspace --config-file $cfg --no-fail-fast 2>&1 | Tee-Object -FilePath (Join-Path $env:GITHUB_WORKSPACE "nextest-$i.log") | Select-String -Pattern 'SLOW|TMT|FAIL|Summary|TIMEOUT'
          }
          Stop-Job $watcher
          Receive-Job $watcher
          "==== dump ===="
          Get-Content $dump

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hang-dump
          path: |
            hang-dump.txt
            nextest-*.log
