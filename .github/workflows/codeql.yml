name: CodeQL

on:
  push:
    branches: [master]
    paths-ignore:
      - '*.md'
      - 'docs/**/*.md'
      - '.github/**/*.md'
      - 'crates/*/*.md'
      - 'docs-site/src/content/docs/**/*.md'
  pull_request:
    branches: [master]
    paths-ignore:
      - '*.md'
      - 'docs/**/*.md'
      - '.github/**/*.md'
      - 'crates/*/*.md'
      - 'docs-site/src/content/docs/**/*.md'
  merge_group:
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, rust]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: /language:${{ matrix.language }}
