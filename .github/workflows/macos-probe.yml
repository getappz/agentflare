name: macos-probe
on:
  push:
    branches: [task/762-fix-ci-master-macos-build-fails-on-agent]
jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: the failing test
        run: cargo test --bin agentflare run_captured -- --nocapture --test-threads=1
